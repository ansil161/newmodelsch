    <!--
      TWO FAMILIES, THREE FACES.

      Fraunces carries every statement the site makes. It is a high-contrast
      display serif with a deliberate wobble in its curves, which is why it is
      here rather than a Playfair or a Garamond - both correct, and both of
      which read as "premium serif" the instant you use them. A school is warm
      before it is expensive.

      Geist carries everything a person operates: navigation, body copy,
      buttons, form labels. Geist Mono carries figures, so a column of
      statistics lines up on the digit.

      This is a net reduction of one request against what the page used to
      load. It previously pulled Geist, Geist Mono and Cormorant Garamond from
      Google plus Clash Display from a second CDN - four families over two
      providers, which is a moodboard rather than a typeface. Cormorant and
      Clash are both gone; Fraunces replaces both jobs.

      Requested as a variable range on the optical-size and weight axes, so
      the whole scale from a 400 caption to a 700 display line is one file.

      CAVEAT is the third family, and it does a job the other two cannot: it is
      ink. The curriculum section is set as a page from a school annual, and the
      annotations around its photographs are meant to read as something a person
      wrote on the print - which is not a thing an italic can fake, however
      warm the italic is. It is Latin-only and it rides in the same request, so
      the page still makes exactly one call for its type.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
    />
  </head>
