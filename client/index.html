<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>New Model High School, Hyderabad. Nursery to Class 10 since 1962.</title>
    <meta
      name="description"
      content="New Model High School, Bahadurpura, Hyderabad. One campus, Nursery through Class 10, and twelve consecutive years of full board results prepared inside school hours. Admissions open for 2026-27."
    />
    <meta property="og:title" content="New Model High School, Hyderabad" />
    <meta
      property="og:description"
      content="Founded 1962. One campus in Bahadurpura, Nursery to Class 10, 10,000 alumni, and no class larger than a teacher can hold every name in."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      TWO FAMILIES, FOUR WEIGHTS (400 / 500 / 600 / 700).

      Geist carries the headings, set semibold; Inter carries body copy,
      navigation, forms, buttons and figures. Both are requested as a variable
      weight range, so the whole scale is one file per family and one request.
      The traditional serif belongs to the logo alone.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Figtree:wght@700;800&family=Geist:wght@400..700&family=Instrument+Serif:ital@1&family=Inter:wght@400..700&display=swap"
    />
    <!-- The homepage hero is the one exception to the two-family rule:
         Figtree, a geometric sans with rounded bowls, for its one headline -
         the claim is the largest type on the site and Geist's grotesque
         reads as corporate at that size.

         Instrument Serif and Caveat belong to the PREVIOUS homepage hero
         (`components/home/HomeCanvasHero.tsx`), which is kept beside the
         current one but is no longer mounted. Nothing on the live site sets
         type in either of them today: drop them from this request at the same
         time as that component, not before. -->

    <!-- Both students in the hero are above the fold and both are the
         composition's focal point, so neither is allowed to arrive late. -->
    <link rel="preload" as="image" type="image/webp" href="/images/home/hero/student-blue.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/images/home/hero/student-girl.webp" />
    <!-- The logo is the first thing the intro shows and the masthead's anchor. -->
    <link rel="preload" as="image" href="/brand/new-model-school-logo.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
